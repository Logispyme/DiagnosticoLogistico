<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico de la Situación Logística | LogisPyme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0f3750;--p2:#1d6a8f;--a:#e68a19;--bg:#f4f7f9;--c:#ffffff;
  --t:#1e293b;--m:#64748b;--border:#e2e8f0;--ok:#16a34a;--no:#dc2626;
  --radius:10px;--shadow:0 4px 14px -2px rgba(15,55,80,0.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',Segoe UI,sans-serif;background:var(--bg);color:var(--t);font-size:13.5px;line-height:1.5}
header{background:var(--p);color:#fff;padding:12px 24px;display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
header h1{margin:0;font-size:15.5px;font-weight:700;letter-spacing:.3px}
header .sp{flex:1}
.logo-box{background:#fff;border-radius:8px;padding:5px 12px;display:inline-flex;align-items:center}
header button,.btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;transition:all .15s ease}
header button:hover,.btn:hover{background:rgba(255,255,255,.25)}
.btn{background:var(--p);border:0}
.btn:hover{background:var(--p2)}
.btn.sec{background:#e2e8f0;color:var(--p);border:0}
.btn.sec:hover{background:#cbd5e1}
.btn.ok{background:var(--ok)}
.btn.ok:hover{background:#15803d}
.btn:disabled{opacity:.4;cursor:not-allowed}

.wrap{display:flex;min-height:calc(100vh - 60px)}
nav{width:260px;background:var(--c);border-right:1px solid var(--border);padding:14px 0;flex:0 0 auto}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9.5px 18px;color:var(--m);text-decoration:none;border-left:3px solid transparent;font-size:12.5px;font-weight:500;transition:all .15s ease}
nav a:hover{background:#f8fafc;color:var(--p)}
nav a.on{background:#f1f5f9;border-left-color:var(--a);font-weight:700;color:var(--p)}
nav a small{background:#e2e8f0;color:var(--p);padding:2px 7px;border-radius:12px;font-size:11px;font-weight:600}

main{flex:1;padding:24px;padding-bottom:80px;max-width:1150px;margin:0 auto;width:100%}
.card{background:var(--c);border-radius:var(--radius);padding:22px 26px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid var(--border)}
h2{margin:0 0 14px;font-size:17.5px;color:var(--p);border-bottom:1px solid var(--border);padding-bottom:10px;font-weight:700}
h3{margin:20px 0 9px;font-size:14.5px;color:var(--p2);font-weight:700}
label{display:block;font-size:12px;color:var(--m);margin-bottom:4px;font-weight:600}
input,select{width:100%;padding:8.5px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:#fff;color:var(--t)}
input:focus,select:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px rgba(29,106,143,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}

.q{border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin:11px 0;background:#fff;transition:all .2s ease}
.q:hover{border-color:#cbd5e1}
.q.miss{border:2px solid var(--no);background:#fef2f2}
.q .t{font-weight:600;margin-bottom:9px;font-size:13.5px;color:var(--t)}
.q .t span{background:#e0f2fe;color:var(--p2);padding:2px 7px;border-radius:5px;font-size:11.5px;margin-right:7px;font-weight:700}
.op{display:flex;gap:11px;align-items:center;padding:8px 11px;border-radius:7px;cursor:pointer;font-size:12.8px;border:1px solid var(--border);margin-bottom:6px;background:#f8fafc;transition:all .15s ease}
.op:hover{background:#f1f5f9;border-color:#94a3b8}
.op input{position:absolute;opacity:0;width:0;height:0}
.op .mk{flex:0 0 16px;width:16px;height:16px;border:2px solid #94a3b8;border-radius:50%;background:#fff}
.op.sel{background:#eff6ff;border-color:#60a5fa;font-weight:600;color:var(--p)}
.op.sel .mk{background:var(--p2);border-color:var(--p2);box-shadow:inset 0 0 0 3px #fff}

table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
th,td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
th{background:#f8fafc;color:var(--p);font-size:11.8px;font-weight:700}
td ul{margin:3px 0;padding-left:17px}
td li{margin:3px 0;line-height:1.4}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px;margin:11px 0}
.kpi div{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.kpi b{display:block;font-size:20px;color:var(--p);font-weight:700}
.hint{background:#f8fafc;border-left:4px solid var(--p2);padding:10px 13px;border-radius:6px;font-size:12.5px;margin:10px 0}
.hint.warn{border-left-color:var(--no);background:#fef2f2;color:#991b1b}
.hint.good{border-left-color:var(--ok);background:#f0fdf4;color:#166534}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
.bar{position:fixed;left:0;bottom:0;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-top:1px solid var(--border);padding:9px 24px;font-size:12.5px;color:var(--m);display:flex;gap:14px;z-index:30}
.bar b{color:var(--p)}
.bar .sp{flex:1}
.b{height:8px;background:#e2e8f0;border-radius:5px;overflow:hidden;min-width:70px}
.b div{height:100%;border-radius:5px}

@media(max-width:960px){.wrap{flex-direction:column}nav{width:100%}}
@media print{header,nav,.bar,.btn,.noprint{display:none!important}main{padding:0;max-width:100%}.card{box-shadow:none;border:0;padding:0}}

        {"id":"5b.8","texto":"¿El operario recibe la orden de la ubicación exacta a la que debe trasladar la carga?","ops":["No; la deposita en el primer hueco que encuentra libre.","Según su propio criterio o costumbre.","El almacén está ordenado por zonas fijas pero sin asignación de posición.","Se le asigna una ubicación manualmente en una orden en papel.","El SGA indica automáticamente la ubicación óptima y valida su colocación."],"mejora":"Implante un sistema en el que el operario reciba la instrucción precisa de en qué hueco depositar la carga.","pts":[0,1.1,2.21,3.31,4.41]},

        {"id":"5b.10","texto":"¿Existe un circuito operativo definido para la recepción de devoluciones?","ops":["No; se acumulan sin clasificar en una esquina del almacén.","Tratamiento informal según el tiempo disponible.","Procedimiento coordinado entre almacén y el departamento comercial.","Circuito reglado con inspección técnica, destino comercial y abono administrativo.","Procedimiento integrado con trazabilidad de RMA y reubicación ágil."],"mejora":"Habilite una zona específica para devoluciones y defina un protocolo diario de inspección y triaje.","pts":[0,1.1,2.21,3.31,4.41]}
      ]},
      {"id":"5c","nombre":"Procesos operativos de preparación (*picking*) y salida","max":44.12,"preguntas":[
        {"id":"5c.1","texto":"¿Cómo se transmiten los pedidos de clientes al personal del almacén?","ops":["Pedidos manuscritos o verbales entregados directamente en mano.","Pedidos transcritos manualmente en un documento en papel.","Departamento específico que introduce los pedidos y emite órdenes de trabajo.","Integración electrónica mediante EDI o pedidos descargados del ERP.","Pedidos volcados directamente desde la web o portal B2B al sistema de almacén."],"mejora":"Elimine los pedidos verbales o en papel informal; toda orden debe generarse desde el sistema.","pts":[0,1.1,2.21,3.31,4.41]},
        {"id":"5c.2","texto":"¿Qué soporte físico o digital guía al operario durante la preparación?","ops":["El pedido comercial original anotado en papel.","Albarán de preparación impreso.","Etiquetas adhesivas secuenciadas de preparación.","Terminal portátil de radiofrecuencia que guía el recorrido.","Sistemas de voz (*pick-by-voice*) o pantallas luminosas (*pick-to-light*)."],"mejora":"Incorpore terminales de radiofrecuencia para guiar la preparación y evitar errores de lectura.","pts":[0,1.1,2.21,3.31,4.41]},
        {"id":"5c.3","texto":"¿Los operarios disponen de carros o elementos de transporte para preparar pedidos?","ops":["No; preparación totalmente a pie cargando bultos a mano.","Carros manuales rudimentarios para preparar un único pedido cada vez.","Transpaletas manuales para mover cargas pesadas.","Transpaletas eléctricas o carros multilínea bien acondicionados.","Equipos específicos de preparación de pedidos a baja y media cota."],"mejora":"Dote a los preparadores de carros ergonómicos que permitan agrupar varios pedidos en un solo viaje.","pts":[0,1.1,2.21,3.31,4.41]},
        {"id":"5c.4","texto":"¿Cómo se asignan y priorizan las órdenes de preparación a los operarios?","ops":["Sin criterio; cada operario coge el albarán que prefiere de la bandeja.","Asignación manual según la proximidad de la salida del camión.","El jefe de almacén asigna pedidos considerando el transporte y urgencia.","Asignación estructurada atendiendo al horario de corte y ventana de entrega.","Algoritmos del SGA que asignan pedidos automáticamente según carga y recorrido."],"mejora":"Priorice la preparación de pedidos en función de las horas de salida acordadas con las agencias de transporte.","pts":[0,1.1,2.21,3.31,4.41]},
        {"id":"5c.5","texto":"¿Se adaptan las técnicas de *picking* a la tipología de los pedidos?","ops":["Siempre se prepara pedido a pedido de forma individual.","El responsable cambia la sistemática solo en campañas de saturación.","Criterios empíricos según el volumen de líneas.","Preparación por lotes (*batch picking*) o por zonas diferenciadas.","Sistemas avanzados de preparación por oleadas (*wave picking*) según rutas."],"mejora":"Agrupe pedidos de pocas líneas para prepararlos de forma conjunta (*batch picking*) y reducir paseos.","pts":[0,1.1,2.21,3.31,4.41]},

        {"id":"5c.7","texto":"¿Cuál es el nivel de exactitud y ausencia de errores en los pedidos preparados?","ops":["Errores muy frecuentes que originan reclamaciones continuas de clientes.","Errores habituales en referencias o cantidades servidas.","Nivel aceptable aunque con incidencias periódicas.","Muy baja tasa de fallos en preparación.","Preparación prácticamente perfecta con exactitud de líneas superior al 99,5 %."],"mejora":"Analice semanalmente las causas de los errores de preparación (confusión de referencia, cantidad errónea).","pts":[0,1.1,2.21,3.31,4.41]},
        {"id":"5c.8","texto":"¿Qué tecnología de apoyo se emplea en la preparación de pedidos?","ops":["Ninguna; proceso puramente visual y manual.","Lectores manuales de código de barras para chequear bultos.","Terminales de radiofrecuencia conectados en tiempo real.","Sistemas de guiado por voz (*voice picking*) o luces en balda (*pick-to-light*).","Sistemas automáticos de preparación o carruseles horizontales/verticales."],"mejora":"Valide cada artículo preparado mediante lectura óptica de código de barras para eliminar el error humano.","pts":[0,1.1,2.21,3.31,4.41]},
        {"id":"5c.9","texto":"¿Se realiza un control de verificación de los pedidos antes de expedir?","ops":["No se realiza ningún control; se embala y envía directamente.","Muestreo aleatorio visual muy superficial.","Control manual y cotejo del 100 % de los albaranes antes de precintar.","Control por pesaje automático o escaneo de bultos expedidos.","Verificación desatendida mediante arcos de lectura RFID o básculas dinámicas."],"mejora":"Instale básculas de control de peso por bulto para detectar discrepancias frente al peso teórico del pedido.","pts":[0,1.1,2.21,3.31,4.41]},

      ]},
      {"id":"5d","nombre":"Tecnología, productividad y costes de manipulación","max":35.29,"preguntas":[
        {"id":"5d.1","texto":"¿Se dispone de un sistema de gestión de almacenes (SGA / WMS)?","ops":["No se dispone de software específico para almacén.","Módulo básico de control de stock dentro del ERP general.","SGA independiente no conectado con el software corporativo.","SGA especializado conectado e integrado con el ERP.","SGA avanzado integrado con ERP, agencias de transporte y sistemas automáticos."],"mejora":"Evalúe la implantación de un SGA adaptado al tamaño de su empresa para guiar todas las operaciones.","pts":[0,1.1,2.21,3.31,4.41]},

        {"id":"5d.4","texto":"¿Se conoce el coste real de manipulación por unidad o por palé movido?","ops":["Se desconoce por completo.","Se conoce solo el coste total de nóminas del almacén.","Estimación aproximada del coste unitario de manipulación.","Coste de manipulación por unidad calculado con razonable precisión.","Coste de manipulación imputado al céntimo por línea, cliente y tipología de pedido."],"mejora":"Calcule el coste de manipulación dividiendo los costes del almacén entre las unidades expedidas al mes.","pts":[0,1.1,2.21,3.31,4.41]},

        {"id":"5d.6","texto":"¿Se conoce con precisión el valor del stock almacenado y su coste de posesión?","ops":["Se desconoce totalmente.","Solo se conoce el valor global de compra sin costes financieros.","Se dispone de estimaciones del coste financiero del inventario.","Conocimiento exacto del valor del stock y sus costes asociados de almacenamiento.","Coste de posesión calculado al detalle integrando mermas, seguros y coste de capital."],"mejora":"Calcule el coste de posesión del stock incorporando el coste de oportunidad financiero y los seguros.","pts":[0,1.1,2.21,3.31,4.41]},

        {"id":"5d.8","texto":"¿Se emplean medidas ergonómicas para evitar sobreesfuerzos en la manipulación?","ops":["No.","Parcialmente, sin método.","Sí, con método básico.","Sí, con método definido y medido.","Sí, con método integrado y mejora continua."],"mejora":"Ajuste las alturas de las baldas de preparación para que los operarios no tengan que agacharse ni estirarse en exceso.","pts":[0,1.1,2.21,3.31,4.41]}

    {"id":"6","nombre":"Transporte de distribución","max":150,"dims":[

        {"id":"6a.2","texto":"¿Qué modelo de flota de transporte utiliza la empresa?","ops":["Flota propia sin control de ocupación ni costes.","Autónomos contratados sin exclusividad ni contratos marco.","Agencias de transporte convencionales de paquetería o carga completa.","Flota vinculada o contratos estables de transporte dedicados.","Modelo mixto optimizado según distancia, volumen y destino."],"mejora":"Analice periódicamente si le conviene flota propia, autónomos dedicados o agencias según su tipología de envíos.","pts":[0,1.56,3.13,4.69,6.25]},

        {"id":"6a.7","texto":"¿Se ajusta la flota a las normativas de tiempos de conducción y zonas de bajas emisiones?","ops":["No.","Parcialmente, sin método.","Sí, con método básico.","Sí, con método definido y medido.","Sí, con método integrado y mejora continua."],"mejora":"Asegúrese de que su flota o la de sus proveedores cumple la normativa ambiental de acceso a ciudades.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6a.8","texto":"¿Se planifica la última milla considerando ventanas horarias y restricciones de entrega?","ops":["No.","Parcialmente, sin método.","Sí, con método básico.","Sí, con método definido y medido.","Sí, con método integrado y mejora continua."],"mejora":"Planifique las entregas agrupándolas por ventanas horarias y zonas geográficas densas.","pts":[0,1.56,3.13,4.69,6.25]}

      {"id":"6b","nombre":"Funcionamiento y seguimiento del proceso de transporte","max":68.75,"preguntas":[
        {"id":"6b.1","texto":"¿Se recogen de forma formal los requisitos de entrega acordados con cada cliente?","ops":["Desconocimiento de los requisitos de entrega del cliente.","Conocimiento verbal de condiciones básicas sin documentar.","Requisitos recogidos informalmente en notas del cliente.","Ficha logística formal que especifica horarios, muelles y necesidades del cliente.","Ficha logística integrada y transmitida automáticamente al transportista."],"mejora":"Elabore una ficha logística por cliente donde consten sus horarios de recepción y restricciones de acceso.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.2","texto":"¿El transportista conoce con antelación las condiciones de entrega del cliente?","ops":["No se le traslada ninguna instrucción específica.","Se le avisa únicamente en casos de problemas graves.","Se le trasladan notas verbales o anotaciones en el albarán.","Se le entrega la ficha de requisitos junto con la orden de transporte.","El conductor recibe las instrucciones de entrega detalladas en su dispositivo móvil."],"mejora":"Transmita a la agencia de transportes los horarios y requisitos de descarga en el momento de asignar el porte.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.3","texto":"¿Qué tecnología se utiliza para intercambiar datos con los transportistas?","ops":["Teléfono y llamadas de voz.","Correo electrónico con ficheros adjuntos.","Portales web de agencias de transporte.","Integración electrónica de expediciones (EDI o web services).","Plataforma integrada con seguimiento GPS y confirmación digital en tiempo real."],"mejora":"Integre su sistema con la plataforma de sus transportistas para generar etiquetas de envío y albaranes automáticamente.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.4","texto":"¿Dispone de flexibilidad para distribuir cualquier volumen de pedido (desde unitario a palé)?","ops":["Muy reducida; solo se admiten pedidos en grandes lotes.","Flexibilidad escasa que origina frecuentes negativas al cliente.","Capacidad para servir paquetería y palés con distintas agencias.","Alta flexibilidad que permite atender pedidos pequeños y grandes sin perder eficiencia.","Flexibilidad total con servicio ágil capilar y distribución multiformato."],"mejora":"Contrate acuerdos con agencias especializadas en paquetería y paletería para responder a cualquier tamaño de pedido.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.5","texto":"¿Cuál es la frecuencia y cadencia habitual de distribución a sus clientes?","ops":["Entregas mensuales o irregulares.","Entregas quincenales o semanales.","Varias entregas programadas por semana.","Servicio diario de entrega.","Múltiples entregas al día en función de las necesidades del cliente."],"mejora":"Aumente la cadencia de entregas en clientes estratégicos mediante rutas fijas regulares.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.6","texto":"¿Cuál es la rapidez de reacción y resolución ante incidencias en la carretera?","ops":["Reacción muy lenta; nos enteramos por las quejas del cliente.","Reacción lenta con escasa capacidad de respuesta.","Respuesta aceptable en el transcurso del día.","Respuesta rápida y proactiva buscando alternativas.","Gestión inmediata con aviso anticipado al cliente y reprogramación en tiempo real."],"mejora":"Exija a sus agencias la notificación de cualquier incidencia en ruta en un plazo máximo de dos horas.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.7","texto":"¿Se utiliza un sistema eficiente de planificación y optimización de rutas?","ops":["No se planifican rutas; el conductor decide el orden sobre la marcha.","Planificación manual basada en la experiencia de los chóferes.","Planificación informática básica agrupando por códigos postales.","Software de optimización de rutas considerando tráfico y ventanas horarias.","Optimización dinámica de rutas en tiempo real asistida por GPS y telemetría."],"mejora":"Adopte un software de optimización de rutas para reducir los costes por kilómetro y equilibrar las cargas.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.8","texto":"¿Cómo se obtiene la constancia o justificante de la mercancía entregada (*POD*)?","ops":["El transportista no informa; se presupone entregada si no hay queja.","Información verbal o telefónica del transportista.","Albarán firmado devuelto en papel días después de la entrega.","Albarán firmado escaneado accesible en el portal del transportista.","Comprobante de entrega digital (*e-POD*) firmado en dispositivo móvil y recibido al instante."],"mejora":"Implante el albarán digital de entrega con firma en terminal móvil (*electronic Proof of Delivery*).","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.9","texto":"¿En qué plazo se dispone de la confirmación formal de la entrega?","ops":["No se dispone de confirmación formal.","Solo cuando llega la factura del transporte a final de mes.","Semanalmente tras recibir los documentos en papel.","Al día siguiente laborable tras la entrega.","En tiempo real o en un plazo inferior a dos horas tras la firma del cliente."],"mejora":"Reduzca a menos de 24 horas el tiempo de disponibilidad del justificante de entrega para poder facturar sin dilaciones.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.10","texto":"¿Existe un sistema eficiente de seguimiento de la mercancía durante el transporte?","ops":["No existe ningún seguimiento del envío.","Llamadas telefónicas al conductor para consultar por dónde va.","Seguimiento básico a través de la web de la agencia mediante código de envío.","Localización en tiempo real del vehículo o del envío.","Torre de control logística con visibilidad integral y alertas automáticas de desviación."],"mejora":"Proporcione a los clientes un enlace de seguimiento web para consultar en todo momento la situación de su expedición.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6b.11","texto":"¿Se ofrece al cliente final visibilidad del estado de su envío en tiempo real?","ops":["No.","Parcialmente, sin método.","Sí, con método básico.","Sí, con método definido y medido.","Sí, con método integrado y mejora continua."],"mejora":"Envíe notificaciones automáticas por correo electrónico o SMS con la hora estimada de entrega (*ETA*).","pts":[0,1.56,3.13,4.69,6.25]}
      ]},
      {"id":"6c","nombre":"Control y costes del transporte","max":31.25,"preguntas":[
        {"id":"6c.1","texto":"¿Cuál es el nivel de fiabilidad y puntualidad en las entregas a clientes?","ops":["Fiabilidad muy deficiente con retrasos crónicos.","Poco fiable; frecuentes entregas fuera de plazo.","Fiabilidad moderada pero mejorable.","Alta fiabilidad y cumplimiento de los plazos comprometidos.","Puntualidad total con cumplimiento de fechas superior al 98 %."],"mejora":"Mida el porcentaje de entregas realizadas dentro del plazo comprometido con el cliente.","pts":[0,1.56,3.13,4.69,6.25]},
        {"id":"6c.2","texto":"¿Cuál es la tasa de roturas o deterioros de producto durante el transporte?","ops":["Elevada tasa de daños por mala estiba, golpes o embalaje inadecuado.","Deterioros frecuentes que generan abonos y reclamaciones.","Nivel normal de siniestralidad dentro de lo previsible.","Muy baja incidencia de daños en el transporte.","Cero incidencias gracias a embalajes validados y correcta sujeción de cargas."],"mejora":"Revise la resistencia del embalaje de transporte y forme a los operarios en las pautas de estiba segura.","pts":[0,1.56,3.13,4.69,6.25]},

  "MED":[{"k":"1-1a","m":44},{"k":"1-1b","m":41},{"k":"1-1c","m":47},{"k":"1-1d","m":43},{"k":"1-1e","m":46},{"k":"2-2a","m":45},{"k":"2-2b","m":49},{"k":"2-2c","m":42},{"k":"2-2d","m":40},{"k":"2-2e","m":48},{"k":"3-3a","m":44},{"k":"3-3b","m":43},{"k":"3-3c","m":46},{"k":"3-3d","m":45},{"k":"3-3e","m":42},{"k":"4-4a","m":47},{"k":"4-4b","m":41},{"k":"4-4c","m":44},{"k":"4-4d","m":45},{"k":"5-5a","m":43},{"k":"5-5b","m":46},{"k":"5-5c","m":44},{"k":"5-5d","m":40},{"k":"6-6a","m":45},{"k":"6-6b","m":47},{"k":"6-6c","m":43},{"k":"7-7a","m":42},{"k":"7-7b","m":46},{"k":"7-7c","m":44},{"k":"7-7d","m":41},{"k":"7-7e","m":45},{"k":"8-8a","m":43},{"k":"8-8b","m":47},{"k":"8-8c","m":42}],

};

function countQuestions(bls){
  var t=0;
  for(var i=0;i<bls.length;i++){
    for(var j=0;j<bls[i].dims.length;j++){
      t += bls[i].dims[j].preguntas.length;
    }
  }
  return t;
}
var M=B.M,SECT=B.SECT,MED=B.MED,MEDF=B.MEDF,MEDTOT=B.MEDTOT,TOTAL=B.TOTAL,QN=countQuestions(M);
var KC="diagLog.actual.v14",KDB="diagLog.basedatos.v1";

function media(k){
  for(var i=0;i<MED.length;i++){
    if(MED[i].k===k) return MED[i].m;
  }
  return 45;
}
function mediaFase(id){
  for(var i=0;i<M.length;i++){
    if(M[i].id===id) return MEDF[i]!=null?MEDF[i]:MEDTOT;
  }
  return MEDTOT;
}
function shuffle(n){
  var a=[];
  for(var i=0;i<n;i++) a.push(i);
  for(var i=n-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function ordenNuevo(){
  var o={};
  for(var b=0;b<M.length;b++){
    for(var d=0;d<M[b].dims.length;d++){
      for(var p=0;p<M[b].dims[d].preguntas.length;p++){
        var q=M[b].dims[d].preguntas[p];
        o[q.id]=shuffle(q.ops.length);
      }
    }
  }
  return o;
}
function blank(){return {empresa:{},resp:{},orden:ordenNuevo(),guardadoId:null,firma:null};}

var A=JSON.parse(localStorage.getItem(KC)||"null");
if(!A||!A.orden) A=blank();

function ord(p){
  if(!A.orden) A.orden={};
  if(!A.orden[p.id]||A.orden[p.id].length!==p.ops.length) A.orden[p.id]=shuffle(p.ops.length);
  return A.orden[p.id];
}
function persist(){try{localStorage.setItem(KC,JSON.stringify(A));}catch(e){}}
function DB(){try{return JSON.parse(localStorage.getItem(KDB)||"[]");}catch(e){return [];}}
function setDB(x){try{localStorage.setItem(KDB,JSON.stringify(x));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function fmt(n,d){
  if(d==null) d=1;
  return (+n).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function allQ(){
  var o=[];
  for(var b=0;b<M.length;b++){
    for(var d=0;d<M[b].dims.length;d++){
      for(var p=0;p<M[b].dims[d].preguntas.length;p++){
        o.push({b:M[b],d:M[b].dims[d],p:M[b].dims[d].preguntas[p]});
      }
    }
  }
  return o;
}
function sinResponder(b){
  var o=[];
  for(var d=0;d<b.dims.length;d++){
    for(var p=0;p<b.dims[d].preguntas.length;p++){
      var q=b.dims[d].preguntas[p];
      if(A.resp[q.id]==null) o.push(q);
    }
  }
  return o;
}

function calc(R){
  R=R||A.resp;
  var tot=0,n=0;
  var bl=[];
  for(var b=0;b<M.length;b++){
    var blk=M[b];
    var bo=0,bn=0,bq=0;
    var dims=[];
    for(var d=0;d<blk.dims.length;d++){
      var dim=blk.dims[d];
      var o=0,c=0;
      for(var p=0;p<dim.preguntas.length;p++){
        var q=dim.preguntas[p];
        var v=R[q.id];
        if(v!=null){ o+=q.pts[v]; c++; }
      }
      bo+=o; bn+=c; bq+=dim.preguntas.length;
      var mdv=media(blk.id+"-"+dim.id);
      var pg=dim.max?(o/dim.max*100):0;
      dims.push({id:dim.id,nombre:dim.nombre,max:dim.max,obt:o,resp:c,n:dim.preguntas.length,pct:pg,md:mdv,pd:mdv?(pg/mdv*100):0});
    }
    var mdf=mediaFase(blk.id);
    var pgf=blk.max?(bo/blk.max*100):0;
    tot+=bo; n+=bn;
    bl.push({id:blk.id,nombre:blk.nombre,max:blk.max,obt:bo,resp:bn,n:bq,pct:pgf,md:mdf,pd:mdf?(pgf/mdf*100):0,dims:dims});
  }
  return {bl:bl,tot:tot,n:n,pct:(tot/TOTAL*100),md:MEDTOT,pd:(tot/TOTAL*100/MEDTOT*100)};
}

function nivel(p){
  return p>=80?["Avanzado","#16a34a"]:p>=60?["Consolidado","#0284c7"]:p>=40?["En desarrollo","#d97706"]:p>=20?["Básico","#ea580c"]:["Inicial","#dc2626"];
}
function bar(p){
  var c=nivel(p)[1];
  return '<div class="b"><div style="width:'+Math.min(100,p)+'%;background:'+c+'"></div></div>';
}

function completo(){return calc().n===QN&&A.empresa.nombre;}
function go(k){cur=k;aviso=null;nav();view();window.scrollTo(0,0);}

    }
    for(var d=0;d<b.dims.length;d++){
      var dim=b.dims[d];
      h+='<h3>'+dim.id+' · '+esc(dim.nombre)+'</h3>';
      for(var p=0;p<dim.preguntas.length;p++){

        var v=A.resp[q.id];

        if(aviso&&aviso.falt){
          for(var fidx=0;fidx<aviso.falt.length;fidx++){

        }

  } else if(cur==="fin"){

    var faltCount=0;
    for(var i=0;i<allQuestions.length;i++){
      if(A.resp[allQuestions[i].p.id]==null) faltCount++;
    }
    var vig=guardadoVigente();
    h='<div class="card"><h2>Finalizar y grabar diagnóstico</h2>';

    if(faltCount>0) h+='<div class="hint warn">Quedan <b>'+faltCount+'</b> preguntas pendientes por responder. Complételas para habilitar la grabación.</div>';

    h+='<button class="btn sec" '+(vig?'':'disabled')+' data-go="inf">🖨️ Ver Informe Ejecutivo</button>';

  } else if(cur==="inf"){

      h='<div class="card"><h2>Informe no disponible</h2><div class="hint warn">Debe responder el cuestionario íntegramente y grabarlo para desbloquear el informe.</div><button class="btn" data-go="fin">Ir a finalizar</button></div>';

function delegar(e){
  var g=e.target.closest("[data-go]");
  if(g){ e.preventDefault(); accion(g.getAttribute("data-go")); return; }
  var op=e.target.closest("label.op");
  if(op){
    e.preventDefault();
    var c=op.closest(".q");
    if(!c) return;
    var r=c.querySelector("input[type=radio]");
    if(r) marcar(c,r.name.slice(1),parseInt(op.getAttribute("data-i"),10));
    return;
  }
  var ab=e.target.closest("[data-abrir]");
  if(ab){ e.preventDefault(); abrir(ab.getAttribute("data-abrir")); return; }
}

function marcar(cont,pid,i){
  if(isNaN(i)) return;
  A.resp[pid]=i;
  persist();
  var labels=cont.querySelectorAll("label.op");
  for(var l=0;l<labels.length;l++){
    var inp=labels[l].querySelector("input");
    var on=(inp.value===String(i));
    labels[l].className="op"+(on?" sel":"");
    inp.checked=on;
  }
  cont.className="q";
  nav();
}

function accion(k){
  if(k==="descargarHtml"){ descargarApp(); return; }
  if(k==="grabar"){ grabar(); return; }
  if(k==="csvResp"){ expCSV(); return; }
  if(k==="csvRes"){ expRes(); return; }
  if(k==="backup"){ dl("diagnosticos_logispyme.json",JSON.stringify(DB(),null,2),"application/json"); return; }
  if(k==="irprimera"){ if(aviso&&aviso.falt.length) irQ(cur.slice(1),aviso.falt[0].id); return; }
  if(cur.charAt(0)==="b"){
    var bi=-1;
    for(var i=0;i<M.length;i++){
      if(M[i].id===cur.slice(1)){ bi=i; break; }
    }
    if(bi>=0){
      var falt=sinResponder(M[bi]);
      if(falt.length){ aviso={id:M[bi].id,falt:falt}; nav(); view(); return; }
    }
  }
  go(k);
}

function irQ(b,q){
  go("b"+b);
  setTimeout(function(){
    var el=document.getElementById("q"+q.replace(/\./g,"_"));
    if(el){ el.className="q miss"; el.scrollIntoView({behavior:"smooth",block:"center"}); }
  },60);
}

function grabar(){
  if(!completo()) return;
  var c=calc(), db=DB();
  var exists=false;
  if(A.guardadoId){
    for(var i=0;i<db.length;i++){
      if(db[i].id===A.guardadoId){ exists=true; break; }
    }
  }
  var id=exists ? A.guardadoId : ("DL-"+new Date().getFullYear()+"-"+String(db.length+1).padStart(4,"0"));
  var fasesData=[];
  for(var i=0;i<c.bl.length;i++){
    var blk=c.bl[i];
    fasesData.push({id:blk.id,nombre:blk.nombre,max:blk.max,obt:Math.round(blk.obt*100)/100,pct:Math.round(blk.pct*100)/100});
  }
  var reg={
    id:id,
    grabado:new Date().toISOString(),
    empresa:JSON.parse(JSON.stringify(A.empresa)),
    resp:JSON.parse(JSON.stringify(A.resp)),
    tot:Math.round(c.tot*100)/100,
    pct:Math.round(c.pct*100)/100,
    fases:fasesData
  };
  var ix=-1;
  for(var i=0;i<db.length;i++){
    if(db[i].id===id){ ix=i; break; }
  }
  if(ix>=0) db[ix]=reg; else db.push(reg);
  setDB(db);
  A.guardadoId=id;
  A.firma=firma();
  persist();
  go("inf");
}

function abrir(id){
  var db=DB();
  var r=null;
  for(var i=0;i<db.length;i++){
    if(db[i].id===id){ r=db[i]; break; }
  }
  if(!r) return;
  A.empresa=JSON.parse(JSON.stringify(r.empresa));
  A.resp=JSON.parse(JSON.stringify(r.resp));
  A.guardadoId=r.id;
  A.firma=firma();
  persist();
  go("inf");
}

function dl(n,t,tp){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:tp}));
  a.download=n;
  a.click();
}

function qCSV(a){
  var res=[];
  for(var i=0;i<a.length;i++){
    res.push('"'+String(a[i]==null?"":a[i]).replace(/"/g,'""')+'"');
  }
  return res.join(";");
}

function expCSV(){
  var L=[qCSV(["Registro","Empresa","Sector","Fecha","Fase","Dimensión","ID","Pregunta","Respuesta","Puntos"])];
  var db=DB();
  var questions=allQ();
  for(var i=0;i<db.length;i++){
    var r=db[i];
    for(var j=0;j<questions.length;j++){
      var x=questions[j];
      var v=r.resp[x.p.id];
      L.push(qCSV([r.id,r.empresa.nombre,r.empresa.sector,r.empresa.fecha,x.b.nombre,x.d.nombre,x.p.id,x.p.texto,v==null?"":x.p.ops[v],v==null?"":x.p.pts[v]]));
    }
  }
  dl("diagnostico_respuestas.csv","\ufeff"+L.join("\n"),"text/csv;charset=utf-8");
}

function expRes(){
  var header=["Registro","Empresa","Sector","Fecha","Total Puntos","% Total"];
  for(var i=0;i<M.length;i++) header.push(M[i].nombre+" (%)");
  var L=[qCSV(header)];
  var db=DB();
  for(var i=0;i<db.length;i++){
    var r=db[i];
    var row=[r.id,r.empresa.nombre,r.empresa.sector,r.empresa.fecha,r.tot,r.pct];
    for(var j=0;j<r.fases.length;j++) row.push(r.fases[j].pct);
    L.push(qCSV(row));
  }
  dl("diagnostico_resumen.csv","\ufeff"+L.join("\n"),"text/csv;charset=utf-8");
}

function descargarApp(){

}

function radar(vals,fases,medias,w){
  var R=w/2-70,cx=w/2,cy=w/2,n=vals.length;
  function pt(i,r){
    var a=-Math.PI/2+2*Math.PI*i/n;
    return [cx+r*Math.cos(a),cy+r*Math.sin(a)];
  }
  function poly(rs){
    var res=[];
    for(var i=0;i<rs.length;i++){
      var p=pt(i,rs[i]);
      res.push(p[0].toFixed(1)+","+p[1].toFixed(1));
    }
    return res.join(" ");
  }
  var g="";
  var steps=[20,40,60,80,100];
  for(var s=0;s<steps.length;s++){
    var p=steps[s];
    var rs=[];
    for(var i=0;i<vals.length;i++) rs.push(R*p/100);
    g+='<polygon points="'+poly(rs)+'" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>';
  }
  for(var i=0;i<vals.length;i++){
    var p2=pt(i,R);
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="#e2e8f0" stroke-width="1.2"/>';
  }
  if(medias&&medias.length){
    var rMed=[];
    for(var i=0;i<medias.length;i++) rMed.push(R*Math.min(100,medias[i])/100);
    g+='<polygon points="'+poly(rMed)+'" fill="none" stroke="#e68a19" stroke-width="2" stroke-dasharray="5 4"/>';
  }
  var rVal=[];
  for(var i=0;i<vals.length;i++) rVal.push(R*Math.min(100,vals[i])/100);
  g+='<polygon points="'+poly(rVal)+'" fill="rgba(29,106,143,.22)" stroke="#1d6a8f" stroke-width="2.2"/>';
  for(var i=0;i<vals.length;i++){
    var p2=pt(i,R*Math.min(100,vals[i])/100);
    g+='<circle cx="'+p2[0].toFixed(1)+'" cy="'+p2[1].toFixed(1)+'" r="3.5" fill="#1d6a8f"/>';
  }
  for(var i=0;i<fases.length;i++){
    var p2=pt(i,R+24);
    var anc=Math.abs(p2[0]-cx)<8?"middle":(p2[0]>cx?"start":"end");
    g+='<text x="'+p2[0].toFixed(1)+'" y="'+p2[1].toFixed(1)+'" font-size="10.5" font-weight="600" fill="#0f3750" text-anchor="'+anc+'">'+esc(fases[i])+'</text>';
    g+='<text x="'+p2[0].toFixed(1)+'" y="'+(p2[1]+12).toFixed(1)+'" font-size="10" fill="#64748b" text-anchor="'+anc+'">'+fmt(vals[i],0)+' %</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+w+'" width="100%" style="max-width:'+w+'px;display:block;margin:0 auto">'+g+'</svg>';
}

  h+='<tr><th>Sector económico</th><td>'+esc(e.sector||'-')+'</td><th>Plantilla estimada</th><td>'+esc(e.empleados||'-')+'</td></tr>';

  h+='<div><b>'+fmt(c.tot)+'</b>de '+TOTAL+' puntos</div>';
  h+='<div><b>'+fmt(c.pct)+' %</b>sobre el máximo</div>';
  h+='<div><b>'+fmt(c.pd,0)+' %</b>sobre media sectorial</div>';
  h+='<div><b style="color:'+n[1]+'">'+n[0]+'</b>Nivel alcanzado</div>';
  h+='</div><h3>2. Resumen por áreas logísticas</h3><table><tr><th>Fase / Dimensión</th><th style="width:65px">Máx.</th><th style="width:65px">Obt.</th><th style="width:60px">% Máx.</th><th style="width:65px">Sector</th><th style="width:100px">Estado</th></tr>';
  for(var i=0;i<c.bl.length;i++){
    var blk=c.bl[i];
    h+='<tr style="background:#f8fafc;font-weight:700"><td>'+blk.id+'. '+esc(blk.nombre)+'</td><td>'+blk.max+'</td><td>'+fmt(blk.obt)+'</td><td>'+fmt(blk.pct)+'%</td><td>'+fmt(blk.md,0)+'%</td><td>'+bar(blk.pct)+'</td></tr>';
    for(var j=0;j<blk.dims.length;j++){
      var dim=blk.dims[j];
      h+='<tr><td style="padding-left:22px">'+dim.id+' '+esc(dim.nombre)+'</td><td>'+dim.max+'</td><td>'+fmt(dim.obt)+'</td><td>'+fmt(dim.pct)+'%</td><td>'+fmt(dim.md,0)+'%</td><td>'+bar(dim.pct)+'</td></tr>';
    }
  }
  h+='<tr style="font-weight:700;background:#f1f5f9"><td>TOTAL GLOBAL</td><td>'+TOTAL+'</td><td>'+fmt(c.tot)+'</td><td>'+fmt(c.pct)+'%</td><td>'+fmt(c.md,0)+'%</td><td>'+bar(c.pct)+'</td></tr>';
  h+='</table><h3>3. Gráfico radar de madurez por fases</h3>';
  var vRadar=[], fRadar=[], mRadar=[];
  for(var i=0;i<c.bl.length;i++){
    vRadar.push(c.bl[i].pct);
    fRadar.push(c.bl[i].nombre);
    mRadar.push(c.bl[i].md);
  }
  h+='<div style="max-width:580px;margin:15px auto">'+radar(vRadar,fRadar,mRadar,580)+'</div>';
  h+='<h3>4. Recomendaciones prioritarias de mejora</h3><ul>';
  for(var i=0;i<M.length;i++){
    var blk=M[i];
    for(var j=0;j<blk.dims.length;j++){
      var dim=blk.dims[j];
      for(var k=0;k<dim.preguntas.length;k++){
        var q=dim.preguntas[k];
        var v=reg.resp[q.id];
        if(v!=null&&v<3&&q.mejora){
          h+='<li><b>['+esc(blk.nombre)+' · '+q.id+']</b>: '+esc(q.mejora)+'</li>';
        }
      }
    }
  }
  h+='</ul><p style="font-size:12px;color:var(--m);margin-top:20px">Registro oficial <b>'+reg.id+'</b> · Grabado el '+new Date(reg.grabado).toLocaleString("es-ES")+'.</p></div>';
  return h;
}
